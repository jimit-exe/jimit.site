version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Australia/Sydney
    open-pull-requests-limit: 5
    ignore:
      # @astrojs/check (the CI type check) supports TypeScript 5 and 6 only.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      astro:
        patterns: ['astro', '@astrojs/*', 'astro-*']
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Australia/Sydney
