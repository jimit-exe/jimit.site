# Builds and checks the site on every push and pull request, and weekly so that a
# security.txt expiry warning or a new advisory shows up even when nothing is pushed.
# Netlify does the deploy (production from main, previews for pull requests).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 21 * * 0' # Mondays 08:17 Sydney time
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Audit dependencies (fail on high or critical)
        run: npm audit --audit-level=high

      - name: Install Playwright Chromium (renders Mermaid diagrams)
        run: npx playwright install --with-deps --only-shell chromium

      - name: Check security.txt expiry
        run: npm run check:security-txt

      - name: Pre-publish check of posts
        run: npm run check:posts

      - name: Build, index and check output
        # Also runs check:posts again, then csp-postbuild, Pagefind and check:dist.
        run: npm run build

      - name: Type check
        run: npx astro check
